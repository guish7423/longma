name: Release LongMa

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for release'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: projects/longma/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install & Build
        shell: pwsh
        run: |
          cd projects/longma
          npm install
          npm run tauri build -- --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: LongMa-Windows
          path: projects/longma/src-tauri/target/release/bundle/

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: projects/longma/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Test
        run: |
          cd projects/longma
          npm install
          npm test
      - name: Build
        run: |
          cd projects/longma
          npm run tauri build -- --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: LongMa-Linux
          path: projects/longma/src-tauri/target/release/bundle/

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: projects/longma/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install & Build
        run: |
          cd projects/longma
          npm install
          npm test
          npm run tauri build -- --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: LongMa-macOS
          path: projects/longma/src-tauri/target/release/bundle/

  create-release:
    name: Create Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: LongMa-*
          merge-multiple: true
      - name: Generate Release Notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo 'notes<<EOF'
            echo "## LongMa v${VERSION}"
            echo ""
            echo "专为 DeepSeek 模型优化的桌面伴侣型 AI Agent"
            echo ""
            echo "### Downloads"
            find . -name "*.deb" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" -o -name "*.dmg" | while read f; do
              echo "- \`$(basename "$f")\` ($(du -h "$f" | cut -f1))"
            done
            echo ""
            echo "### SHA256 Checksums"
            find . -name "*.deb" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" -o -name "*.dmg" | while read f; do
              echo "- \`$(basename "$f")\`: \`$(sha256sum "$f" | cut -d' ' -f1)\`"
            done
            echo ""
            echo "### Features"
            echo "- Chat UI (DeepSeek Flash/Pro)"
            echo "- Memory system (7-tier + semantic vector search)"
            echo "- TICK time-sense engine (dynamic heartbeat + reminders + task stack)"
            echo "- Speculative injection (intent/pattern/knowledge parallel pre-queries)"
            echo "- Cache-first three-tier model (Hot/Warm/Cold)"
            echo "- Parallel tool dispatch + 4-mode auto-repair"
            echo "- R1 thinking chain harvesting (collapsible reasoning panel)"
            echo "- MCP client (Stdio/HTTP)"
            echo "- Cost dashboard + budget control"
            echo "- ACUI v2 glassmorphism design system"
            echo "- System tray + auto-update"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "LongMa v${{ github.ref_name }}"
          body: ${{ steps.notes.outputs.notes }}
          draft: true
          files: |
            **/*.deb
            **/*.AppImage
            **/*.msi
            **/*.exe
            **/*.dmg
