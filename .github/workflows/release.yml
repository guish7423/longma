name: Release LongMa

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - run: npm install
      - run: npm test
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: LongMa-Linux
          path: src-tauri/target/release/bundle/

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm test
      - run: npm run tauri build
      - name: Create ZIP installer
        shell: pwsh
        run: |
          Compress-Archive -Path src-tauri/target/release/bundle/nsis/*.exe -DestinationPath LongMa_Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LongMa-Windows
          path: src-tauri/target/release/bundle/
      - uses: actions/upload-artifact@v4
        with:
          name: LongMa-Windows-ZIP
          path: LongMa_Windows.zip

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm test
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: LongMa-macOS
          path: src-tauri/target/release/bundle/

  create-release:
    name: Create Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: LongMa-*
          merge-multiple: true
      - name: Generate Release Notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo 'notes<<EOF'
            echo "## LongMa v${VERSION}"
            echo ""
            echo "专为 DeepSeek 模型优化的桌面伴侣型 AI Agent"
            echo ""
            echo "### Downloads"
            find . -name "*.deb" -o -name "*.msi" -o -name "*.exe" -o -name "*.dmg" | while read f; do
              echo "- \`$(basename "$f")\` ($(du -h "$f" | cut -f1))"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "LongMa v${{ github.ref_name }}"
          body: ${{ steps.notes.outputs.notes }}
          draft: true
          files: |
            **/*.deb
            **/*.rpm
            **/*.msi
            **/*.exe
            **/*.dmg
            **/*.zip
